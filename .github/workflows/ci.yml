name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: cargo test --locked
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: End-to-end (real downloads, signatures and shims)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/e2e/run.sh target/debug/bvm
